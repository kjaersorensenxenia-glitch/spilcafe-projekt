<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spilcafeen</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="shortcut icon" href="file:///C:/Users/user/Downloads/image%205.svg" type="image/x-icon" />
    
    
  </head>

  <body>
    <header>
      
    </header>

    <main>
      <!-- Filter bar med alle filtreringsmuligheder -->
      <section class="filterbar">
        <!-- Øverste række: Søg og genre -->
        <div class="filter-row-main">
          <div class="filter-group search-group">
            <label for="search-input"> Søg</label>
            <input type="text" id="search-input" placeholder="Søg efter et spil..." />
          </div>

          <div class="filter-group">
            <label for="genre-select"> Kategori</label>
            <select id="genre-select">
              <option value="all">Alle kategorier</option>
              <!-- Kategorier indsættes dynamisk via JavaScript -->
            </select>
          </div>

          <div class="filter-group">
            <label for="sort-select"> Sortering</label>
            <select id="sort-select">
              <option value="none">Ingen sortering</option>
              <option value="title">Titel (A-Å)</option>
              <option value="rating">Rating (højeste først)</option>
            </select>
          </div>
        </div>

          <!-- Rating range filter -->
          <div class="filter-group range-group">
            <label class="range-label"> Rating</label>
            <div class="range-inputs">
              <input type="number" id="rating-from" placeholder="0.0" min="0" max="10" step="0.1" />
              <span class="range-separator">→</span>
              <input type="number" id="rating-to" placeholder="10.0" min="0" max="10" step="0.1" />
            </div>
          </div>

          <!-- Ryd alle filtre knap -->
          <button id="clear-filters" class="clear-btn">
            <span class="btn-icon">🗑️</span>
            <span class="btn-text">Nulstil filtre</span>
          </button>
        </div>
      </section>

      <!-- spil grid -->
      <section id="game-list" class="game-grid">
        <!-- spil vil blive indsat her dynamisk -->
      </section>
    </main>

    <!-- Footer -->
    <footer>
      <p>© RACE - Rasmus Cederdorff</p>
    </footer>

    <!-- Game Detail Modal -->
    <dialog id="game-dialog">
      <form method="dialog">
        <button id="close-dialog" aria-label="Close">✕</button>
        <div id="dialog-content">
          <!-- Game details will be injected here via JavaScript -->
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
